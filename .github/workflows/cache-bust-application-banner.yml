name: Cache-bust application banner assets

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  cache-bust:
    if: contains(github.event.head_commit.message, '[cache-bust-assets]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add version query strings to primary site pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          changed = []
          for path in sorted(Path('.').rglob('*.html')):
              text = path.read_text()
              if 'id="site-header"' not in text:
                  continue
              new = text.replace(
                  'href="/assets/css/layout.css"',
                  'href="/assets/css/layout.css?v=1c87b03"',
              ).replace(
                  'src="/assets/js/nav.js"',
                  'src="/assets/js/nav.js?v=1c87b03"',
              )
              if new != text:
                  path.write_text(new)
                  changed.append(str(path))

          if len(changed) != 21:
              raise SystemExit(f'Expected 21 primary HTML pages, changed {len(changed)}: {changed}')
          print('\n'.join(changed))
          PY
          rm .github/workflows/cache-bust-application-banner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b deploy/application-banner-cache-bust
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only -- '*.html' | wc -l)" -eq 21
          test "$(git diff --cached --name-only | wc -l)" -eq 22
          git commit -m "Cache-bust application banner assets"
          git push --force origin HEAD:refs/heads/deploy/application-banner-cache-bust
